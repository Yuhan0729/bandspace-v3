<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BandSpace</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <h1>BandSpace</h1>
    <p>Choose an available time and book your rehearsal.</p>

    <div class="date-row">
      <span>Select date</span>
      <strong>24 Oct 2026</strong>
    </div>

    <h2>Schedule</h2>

    <div class="time-slot booked">
      <span>14:00 - 16:00</span>
      <span>BOOKED</span>
    </div>

    <div class="time-slot available" data-start="16:00" data-end="17:00">
      <span>16:00 - 17:00</span>
      <span>AVAILABLE</span>
    </div>

    <div class="time-slot booked">
      <span>17:00 - 19:00</span>
      <span>BOOKED</span>
    </div>

    <div class="time-slot available" data-start="19:00" data-end="20:00">
      <span>19:00 - 20:00</span>
      <span>AVAILABLE</span>
    </div>

    <div id="bookingForm" class="booking-form">

      <h2>Book a rehearsal</h2>

      <p>
        Date:
        <strong>24 Oct 2026</strong>
      </p>

      <p>
        Time:
        <strong id="selectedTime">Choose a time</strong>
      </p>

      <input id="nameInput" type="text" placeholder="Your name">

      <input id="bandInput" type="text" placeholder="Band name">

      <button id="confirmButton">
        Confirm booking
      </button>

    </div>

    <div id="confirmation" class="confirmation">

      <h2>Booking confirmed ✓</h2>

      <h3 id="confirmedBand"></h3>

      <p>24 Oct 2026</p>

      <p id="confirmedTime"></p>

      <button id="editButton">Edit booking</button>

      <button id="cancelButton">Cancel booking</button>

      <button id="backButton">Back to schedule</button>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
